<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <!-- CSS -->
    <style>
        body {
            background: #f1f2f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .calculator {
            background: #2f3640;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 28px;
            margin-bottom: 15px;
            text-align: right;
            padding: 10px;
            border: none;
            outline: none;
            border-radius: 5px;
            background: #dcdde1;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #718093;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #57606f;
        }

        .operator {
            background: #e1b12c;
        }

        .operator:hover {
            background: #d19815;
        }

        .clear {
            background: #e84118;
        }

        .clear:hover {
            background: #c23616;
        }
    </style>
</head>

<body>

    <!-- Calculator -->
    <div class="calculator">
        <input type="text" id="display" disabled>

        <div class="buttons">
            <button class="clear">C</button>
            <button class="operator">/</button>
            <button class="operator">*</button>
            <button class="operator">-</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>=</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>0</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const display = document.getElementById("display");
        const buttons = document.querySelectorAll("button");

        let input = "";

        buttons.forEach(button => {
            button.addEventListener("click", () => {
                const value = button.textContent;

                if (value === "C") {
                    input = "";
                    display.value = "";
                }
                else if (value === "=") {
                    try {
                        input = eval(input); // Calculate the expression
                        display.value = input;
                    } catch {
                        display.value = "Error";
                    }
                }
                else {
                    input += value;
                    display.value = input;
                }
            });
        });
    </script>

</body>
</html>
